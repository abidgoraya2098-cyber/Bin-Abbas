  </defs>
  <!-- Medical Care Cross & Heart Symbol -->
  <circle cx="256" cy="256" r="180" fill="white" fill-opacity="0.12" stroke="#2dd4bf" stroke-width="8"/>
  <path d="M256 140 C210 90 120 120 120 200 C120 280 256 370 256 370 C256 370 392 280 392 200 C392 120 302 90 256 140 Z" fill="#14b8a6" filter="url(#shadow)"/>
